# Checks the pull request title. PRs are squashed, so the title becomes the commit subject on main
# and a line of the release notes. It runs again when the title is edited, apart from the full CI.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/pr-title-check.sh "$TITLE"
