name: Windows

on:
  pull_request:
    paths: ["windows/**", "shared-fixtures/**", ".github/workflows/windows.yml"]
  push:
    branches: [main]
    paths: ["windows/**", "shared-fixtures/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test Windows app
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json
      - run: dotnet build Navi.slnx -c Release
      - run: dotnet test Navi.slnx -c Release --no-build
      - run: dotnet format Navi.slnx --verify-no-changes
